<!-- =============================================================
  usuarios.page.html — Gestión de Usuarios
  HelpDesk Web | Feature 006 · CRUD Usuarios
  =============================================================
  Responsabilidad: permite al admin listar, ver detalle,
  cambiar rol y desactivar usuarios del sistema.
  Solo accesible para el rol admin.
  ============================================================= -->

<ion-header class="ion-no-border">
  <ion-toolbar class="header-toolbar">

    <ion-buttons slot="start">
      <ion-back-button defaultHref="/tickets" text="" class="back-btn"></ion-back-button>
    </ion-buttons>

    <ion-title class="header-title">Usuarios</ion-title>

    <!-- Botón nuevo usuario -->
    <ion-buttons slot="end">
      <ion-button (click)="mostrarFormulario = true" class="nuevo-btn">
        <ion-icon name="person-add-outline"></ion-icon>
      </ion-button>
    </ion-buttons>

  </ion-toolbar>
</ion-header>

<ion-content class="usuarios-content">

  <!-- -----------------------------------------------------
    Modal crear usuario
  ------------------------------------------------------ -->
  <div class="modal-overlay" *ngIf="mostrarFormulario" (click)="cerrarFormulario()">
    <div class="modal-card" (click)="$event.stopPropagation()">

      <div class="modal-header">
        <h2>Nuevo Usuario</h2>
        <button class="modal-close" (click)="cerrarFormulario()">✕</button>
      </div>

      <!-- Nombre -->
      <div class="form-field">
        <label class="field-label">Nombre completo *</label>
        <input class="field-input" type="text" [(ngModel)]="nuevoNombre" placeholder="Juan Pérez">
        <div class="field-error" *ngIf="errores.nombre">{{ errores.nombre }}</div>
      </div>

      <!-- Email -->
      <div class="form-field">
        <label class="field-label">Correo electrónico *</label>
        <input class="field-input" type="email" [(ngModel)]="nuevoEmail" placeholder="juan@empresa.com">
        <div class="field-error" *ngIf="errores.email">{{ errores.email }}</div>
      </div>

      <!-- Password -->
      <div class="form-field">
        <label class="field-label">Contraseña *</label>
        <input class="field-input" type="password" [(ngModel)]="nuevoPassword" placeholder="Mínimo 8 caracteres">
        <div class="field-error" *ngIf="errores.password">{{ errores.password }}</div>
      </div>

      <!-- Rol -->
      <div class="form-field">
        <label class="field-label">Rol *</label>
        <select class="field-input" [(ngModel)]="nuevoRol">
          <option value="1">Usuario</option>
          <option value="2">Técnico</option>
          <option value="3">Mesa de Ayuda</option>
          <option value="4">Admin</option>
        </select>
      </div>

      <!-- Error general -->
      <div class="error-message" *ngIf="errorMensaje">{{ errorMensaje }}</div>

      <!-- Botones -->
      <div class="modal-actions">
        <button class="btn-cancelar" (click)="cerrarFormulario()">Cancelar</button>
        <button class="btn-crear" (click)="crearUsuario()" [disabled]="creando">
          <span *ngIf="!creando">Crear usuario</span>
          <span *ngIf="creando">Creando...</span>
        </button>
      </div>

    </div>
  </div>

  <!-- Cargando -->
  <div class="loading-state" *ngIf="cargando">
    <ion-spinner name="crescent" color="primary"></ion-spinner>
  </div>

  <!-- Lista de usuarios -->
  <div class="usuarios-list" *ngIf="!cargando">

    <div class="usuario-card" *ngFor="let u of usuarios">

      <div class="card-left">
        <div class="avatar" [class]="'rol-' + u.id_rol">
          {{ u.nombre.charAt(0).toUpperCase() }}
        </div>
        <div class="usuario-info">
          <div class="usuario-nombre">{{ u.nombre }}</div>
          <div class="usuario-email">{{ u.email }}</div>
          <div class="usuario-meta">
            <span class="rol-badge" [class]="'rol-badge-' + u.id_rol">
              {{ getRolLabel(u.id_rol) }}
            </span>
            <span class="estado-chip" [class.inactivo]="!u.activo">
              {{ u.activo ? 'Activo' : 'Inactivo' }}
            </span>
          </div>
        </div>
      </div>

      <div class="card-actions">
        <select class="rol-select" [(ngModel)]="u.id_rol" (change)="cambiarRol(u)">
          <option value="1">Usuario</option>
          <option value="2">Técnico</option>
          <option value="3">Mesa Ayuda</option>
          <option value="4">Admin</option>
        </select>
        <button class="delete-btn" *ngIf="u.activo" (click)="desactivarUsuario(u)">
          <ion-icon name="trash-outline"></ion-icon>
        </button>
      </div>

    </div>

    <div class="empty-state" *ngIf="usuarios.length === 0">
      <ion-icon name="people-outline"></ion-icon>
      <h3>Sin usuarios</h3>
    </div>

  </div>

</ion-content>
