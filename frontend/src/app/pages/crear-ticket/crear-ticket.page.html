<!-- =============================================================
  crear-ticket.page.html — Crear Nuevo Ticket
  HelpDesk Web | Feature 014 · Frontend Tickets
  =============================================================
  Responsabilidad: formulario para registrar un nuevo
  requerimiento técnico. Valida los campos en el frontend
  antes de enviar al backend. El autor se obtiene del JWT.
  ============================================================= -->

<ion-header class="ion-no-border">
  <ion-toolbar class="header-toolbar">

    <!-- Botón volver a la bandeja -->
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/tickets" text="" class="back-btn"></ion-back-button>
    </ion-buttons>

    <ion-title class="header-title">Nuevo Ticket</ion-title>

  </ion-toolbar>
</ion-header>

<ion-content class="crear-content">

  <div class="form-container">

    <!-- -----------------------------------------------------
      Campo: Título del requerimiento
      Valida al abandonar el campo con (blur)
    ------------------------------------------------------ -->
    <div class="field-group">
      <div class="field-label">Título *</div>
      <input
        class="field-input"
        [(ngModel)]="titulo"
        placeholder="Describe brevemente el problema"
        maxlength="150"
        (blur)="validarTitulo()">
      <div class="field-hint">{{ titulo.length }}/150</div>
      <div class="field-error" *ngIf="errores['titulo']">
        {{ errores['titulo'] }}
      </div>
    </div>

    <!-- -----------------------------------------------------
      Campo: Descripción detallada del requerimiento
      Valida al abandonar el campo con (blur)
    ------------------------------------------------------ -->
    <div class="field-group">
      <div class="field-label">Descripción *</div>
      <textarea
        class="field-input field-textarea"
        [(ngModel)]="descripcion"
        placeholder="Explica con detalle el requerimiento..."
        rows="4"
        (blur)="validarDescripcion()">
      </textarea>
      <div class="field-error" *ngIf="errores['descripcion']">
        {{ errores['descripcion'] }}
      </div>
    </div>

    <!-- -----------------------------------------------------
      Selector de categoría — Técnica, Redes o ERP
    ------------------------------------------------------ -->
    <div class="field-group">
      <div class="field-label">Categoría *</div>
      <div class="options-row">
        <div class="option-btn"
          *ngFor="let cat of categorias"
          [class.selected]="idCategoria === cat.id"
          (click)="idCategoria = cat.id; validarCategoria()">
          {{ cat.label }}
        </div>
      </div>
      <div class="field-error" *ngIf="errores['categoria']">
        {{ errores['categoria'] }}
      </div>
    </div>

    <!-- -----------------------------------------------------
      Selector de prioridad — Baja, Media o Alta
    ------------------------------------------------------ -->
    <div class="field-group">
      <div class="field-label">Prioridad *</div>
      <div class="options-row">
        <div class="option-btn prioridad-baja"
          [class.selected]="prioridad === 'baja'"
          (click)="prioridad = 'baja'; validarPrioridad()">
          🟢 Baja
        </div>
        <div class="option-btn prioridad-media"
          [class.selected]="prioridad === 'media'"
          (click)="prioridad = 'media'; validarPrioridad()">
          🟡 Media
        </div>
        <div class="option-btn prioridad-alta"
          [class.selected]="prioridad === 'alta'"
          (click)="prioridad = 'alta'; validarPrioridad()">
          🔴 Alta
        </div>
      </div>
      <div class="field-error" *ngIf="errores['prioridad']">
        {{ errores['prioridad'] }}
      </div>
    </div>

    <!-- -----------------------------------------------------
      Botón de envío — deshabilitado mientras se procesa
    ------------------------------------------------------ -->
    <button
      class="submit-btn"
      (click)="crearTicket()"
      [disabled]="enviando">
      <ion-spinner *ngIf="enviando" name="crescent"></ion-spinner>
      <span *ngIf="!enviando">Crear Ticket</span>
    </button>

  </div>

</ion-content>
