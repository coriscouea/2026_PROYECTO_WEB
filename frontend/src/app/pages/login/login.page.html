<!-- ============================================================
  login.page.html — Pantalla de Login
  HelpDesk Web | Feature 013 · Frontend Login
  ============================================================ -->

<ion-content class="login-content">

  <div class="login-container">

    <!-- Logo e título -->

    <div class="login-header">
      <ion-icon name="help-circle" class="logo-icon"></ion-icon>
      <h1>HelpDesk Web</h1>
      <p>Sistema de Soporte Técnico</p>
    </div>

    <!-- Formulario -->

    <div class="login-form">

      <ion-item class="input-item">
        <ion-label position="floating">Correo electrónico</ion-label>
        <ion-input
          type="email"
          [(ngModel)]="email"
          placeholder="usuario@empresa.com"
          autocomplete="email">
        </ion-input>
      </ion-item>

      <ion-item class="input-item">
        <ion-label position="floating">Contraseña</ion-label>
        <ion-input
          [type]="mostrarPassword ? 'text' : 'password'"
          [(ngModel)]="password"
          placeholder="••••••••">
        </ion-input>
        <ion-button fill="clear" slot="end" (click)="togglePassword()">
          <ion-icon [name]="mostrarPassword ? 'eye-off' : 'eye'"></ion-icon>
        </ion-button>
      </ion-item>

      <!-- Mensaje de error -->

      <div class="error-message" *ngIf="errorMensaje">
        <ion-icon name="alert-circle"></ion-icon>
        {{ errorMensaje }}
      </div>

      <!-- Botón login -->
       
      <ion-button
        expand="block"
        class="login-btn"
        (click)="iniciarSesion()"
        [disabled]="cargando">
        <ion-spinner *ngIf="cargando" name="crescent"></ion-spinner>
        <span *ngIf="!cargando">Iniciar sesión</span>
      </ion-button>

    </div>

  </div>

</ion-content>
